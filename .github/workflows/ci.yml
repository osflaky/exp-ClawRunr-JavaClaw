name: CI

on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          arch: arm64
          runner: windows-11-arm
          distribution: zulu
          expander_leg: windows-latest--arm64
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: ${{ matrix.distribution || 'temurin' }}
        architecture: ${{ matrix.arch == 'arm64' && 'aarch64' || 'x64' }}
        cache: 'gradle'

    - name: Run tests
      run: ./gradlew test
    name: test [${{ matrix.expander_leg }}]
    timeout-minutes: 150
